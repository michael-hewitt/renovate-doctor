# renovate-doctor - the reusable workflow a project calls with a short caller workflow of its own.
#
# Triage mode runs when one of the caller's CI workflows fails on a Renovate PR: the gate decides whether
# the failure gets the agent, the agent (Claude Code, following skills/renovate-doctor/SKILL.md) fixes and
# auto-merges it, reruns it, declines it with a trip wire or escalates it. Lift mode runs monthly: it ticks
# the Dependency Dashboard for holds lifted earlier that Renovate has not reopened, then removes the holds
# whose date has passed in one auto-merged PR. Either way, the `report` job then sends the one email a run
# produces, or stays silent. It is a separate job on a GitHub-hosted runner because the triage and lift jobs
# run code nobody reviewed (the updated dependency's install scripts, the agent's commands): the mail key
# lives only in the report job, which runs nothing but this repository's own scripts.
#
# docs/architecture.md is the contract for every input, output and environment variable used here; the
# README is the user-facing description, with a complete caller. Concurrency is the caller's: one group per
# Renovate branch, queued and never cancelled, so an agent is never stopped mid-push.

name: renovate-doctor

on:
  workflow_call:
    inputs:
      mode:
        description: '`triage` or `lift`. The caller computes it from its event (`schedule` means `lift`).'
        type: string
        default: triage
      runs_on:
        description: 'JSON for `runs-on`: a quoted string (`"ubuntu-latest"`) or an array (`["self-hosted", "linux"]`).'
        type: string
        default: '"ubuntu-latest"'
      package_manager:
        description: '`npm` or `pnpm`. With `pnpm` the workflow installs the pnpm version named by `packageManager`.'
        type: string
        default: npm
      node_version_file:
        description: "The project's Node version file, read at the PR head, for the install and the agent."
        type: string
        default: .nvmrc
      install:
        description: 'Install command. Empty means `npm ci` or `pnpm install --frozen-lockfile`.'
        type: string
        default: ''
      typecheck:
        description: 'Typecheck command. Empty means the project has none.'
        type: string
        default: ''
      test:
        description: 'Test command. Empty means `npm test` or `pnpm test`.'
        type: string
        default: ''
      service_setup:
        description: "Plain Bash and Docker, run before the install on the caller's own commit (not the PR head); the project's toolchain is not installed yet. May write to $GITHUB_ENV."
        type: string
        default: ''
      service_teardown:
        description: 'Bash run after the agent, whatever happened, on the PR-head checkout: keep it self-contained.'
        type: string
        default: ''
      email_to:
        description: 'Where the report goes.'
        type: string
        required: true
      email_from:
        description: 'The sender address; Mandrill must accept it for the key.'
        type: string
        required: true
      email_from_name:
        description: "The sender's display name."
        type: string
        default: renovate-doctor
      notes_file:
        description: "Repository-relative path of the project-notes file, read from the caller's own commit."
        type: string
        default: ''
      rerun_workflow:
        description: 'Name of a rerun automation to defer to on first-attempt network failures.'
        type: string
        default: ''
      renovate_config:
        description: 'Repository-relative path of the Renovate config (JSON) the lift mode edits and reads.'
        type: string
        default: renovate.json
      # A caller forwarding its own `workflow_dispatch` inputs wraps these two in `fromJSON`
      # (`${{ fromJSON(inputs.pr || '0') }}`): a dispatch's `number` input reaches the `inputs` context as a
      # string, which a `type: number` input here rejects at run creation, before any job exists ("workflow
      # file issue", no jobs). Boolean dispatch inputs are booleans and need nothing.
      pr:
        description: "Manual runs: the PR to triage. From a workflow_dispatch input, pass fromJSON(inputs.pr || '0')."
        type: number
        default: 0
      run_id:
        description: "Manual runs: the failed run to triage; 0 means the failed runs on the PR head. From a workflow_dispatch input, pass fromJSON(inputs.run_id || '0')."
        type: number
        default: 0
      dry_run:
        description: 'Push, comment, merge, rerun and open nothing; print the email instead of sending it.'
        type: boolean
        default: false
      timeout_minutes:
        description: "The job's timeout."
        type: number
        default: 60
      model:
        description: 'The Claude model the triage and lift agents run on, as `claude --model` takes it.'
        type: string
        default: claude-opus-5-5
      effort:
        description: 'The effort level the triage and lift agents run at, as `claude --effort` takes it: low, medium, high, xhigh or max.'
        type: string
        default: high
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token for anthropics/claude-code-action (`claude setup-token`).'
        required: true
      MANDRILL_API_KEY:
        description: 'Mandrill API key for the report email. Only the report job sees it, never the agent.'
        required: true

jobs:
  triage:
    if: inputs.mode == 'triage'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # The caller grants these; a called job cannot have more than its caller gave. `actions: write` lets the
    # agent rerun failed jobs, `checks: read` and `statuses: read` let it read the PR's checks (the Claude App
    # token cannot read runs or checks, so the agent reads them with this job's token), and `id-token: write`
    # lets claude-code-action exchange the job's OIDC token for the Claude GitHub App token that the agent
    # pushes, comments and merges with.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: read
      id-token: write
    env:
      # The commands a dry run refuses, as Claude Code permission rules: every write to GitHub the skill
      # knows. Written once here for `--disallowedTools` and for the prompt, which tells the agent a refusal
      # is expected. A deny rule matches past a leading variable assignment, so `GH_TOKEN=... gh run rerun`
      # is refused by the `gh run rerun` rule.
      RENOVATE_DOCTOR_DRY_RUN_REFUSED: >-
        Bash(git push:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh run rerun:*),Bash(gh issue:*),Bash(gh pr ready:*),Bash(gh pr reopen:*),Bash(gh workflow run:*),Bash(gh label:*),Bash(gh run cancel:*),Bash(gh release:*)
    # What the report job needs from this one. Job outputs rather than files, because nothing written in
    # this job's workspace after the install can be trusted; the outcome file goes as an artifact, as data.
    outputs:
      launch: ${{ steps.gate.outputs.launch }}
      outcome: ${{ steps.gate.outputs.outcome }}
      summary: ${{ steps.gate.outputs.summary }}
      reason: ${{ steps.gate.outputs.reason }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      pr_url: ${{ steps.gate.outputs.pr_url }}
      pr_title: ${{ steps.gate.outputs.pr_title }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      agent_outcome: ${{ steps.agent.outcome }}
      # The attempt this job ran in, which names its outcome artifact. A re-run of the report job alone is a
      # later attempt but reads this job's outputs and artifact from the attempt that produced them.
      attempt: ${{ github.run_attempt }}
    steps:
      # A self-hosted runner that is not ephemeral may keep RUNNER_TEMP between jobs, and a stale outcome
      # file or notes copy from an earlier run would be taken for this run's, so the doctor's scratch
      # directory starts empty.
      - name: Clear renovate-doctor's scratch directory
        run: rm -rf "$RUNNER_TEMP/renovate-doctor"

      # The caller's repository at the commit this run was started from (GITHUB_SHA, the default branch's tip
      # for a workflow_run), which is where the notes file and the service setup are read: an older Renovate
      # branch may predate either. The PR head is only known once the gate has read the event. Full
      # history, because the agent reads the branch's commits and branches from the default branch for a
      # hold PR.
      # `persist-credentials: false`: the job's token must not stay in the checkout's git config. The agent
      # pushes with the Claude App token claude-code-action puts in the remote URL, and a persisted job token
      # wins over that URL (git sends it as a header), so the first caller's first live push went out as
      # github-actions[bot], whose pushes GitHub leaves at "action required" with no CI run. The one later
      # fetch, of the PR head, carries the job token itself.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # This repository's scripts and skill, at the commit of this workflow file - the tag the caller pinned -
      # so the code that runs is always the code the caller chose. It is public, so no credentials are kept.
      - name: Check out renovate-doctor
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'michael-hewitt/renovate-doctor' }}
          ref: ${{ job.workflow_sha }}
          path: .renovate-doctor
          persist-credentials: false

      # Ignored through .git/info/exclude rather than .gitignore, so the agent's `git status` stays clean
      # without a change to the caller's tracked files.
      - name: Hide renovate-doctor from git
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          echo '/.renovate-doctor/' >> .git/info/exclude
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::warning::job.workflow_sha is empty, so renovate-doctor ran from its default branch rather than the tag this caller pinned."
          fi

      # The gate runs on renovate-doctor's own Node version, whatever the project uses; the project's Node is
      # set up after the PR head is checked out.
      - name: Set up Node for renovate-doctor
        uses: actions/setup-node@v7
        with:
          node-version-file: .renovate-doctor/.nvmrc

      # Reusable-workflow inputs cannot default to a value that depends on another input, so the install and
      # test defaults for the package manager are worked out here. Multi-line commands survive the heredoc
      # form of $GITHUB_OUTPUT.
      - name: Work out the project's commands
        id: commands
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
          INSTALL: ${{ inputs.install }}
          TEST: ${{ inputs.test }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) install_default='npm ci'; test_default='npm test' ;;
            pnpm) install_default='pnpm install --frozen-lockfile'; test_default='pnpm test' ;;
            *) echo "::error::package_manager must be npm or pnpm, not '$PACKAGE_MANAGER'."; exit 1 ;;
          esac
          {
            echo 'install<<RENOVATE_DOCTOR_EOF'
            echo "${INSTALL:-$install_default}"
            echo 'RENOVATE_DOCTOR_EOF'
            echo 'test<<RENOVATE_DOCTOR_EOF'
            echo "${TEST:-$test_default}"
            echo 'RENOVATE_DOCTOR_EOF'
          } >> "$GITHUB_OUTPUT"

      # Launch or skip, and why. The gate always exits 0 and its decision is in its outputs; it also writes
      # the failed runs' logs for the agent. GITHUB_EVENT_NAME, GITHUB_EVENT_PATH and GITHUB_WORKFLOW_REF
      # are the caller's inside a called workflow, which is what the gate expects.
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RERUN_WORKFLOW: ${{ inputs.rerun_workflow }}
          # The logins whose marker comments count as "handled". Empty means the gate's default, the Claude
          # App and the job token's github-actions[bot]; a caller whose agent comments as another account sets
          # the repository or organisation variable (a caller cannot set env inside a called workflow, but
          # `vars` here are the caller's).
          RENOVATE_DOCTOR_COMMENT_AUTHORS: ${{ vars.RENOVATE_DOCTOR_COMMENT_AUTHORS }}
        # The gh version first: the scripts use the runner's own `gh`, and a self-hosted runner's may be old.
        run: |
          gh --version | head -1
          node .renovate-doctor/scripts/gate.mjs

      # The notes file from the caller's own commit, copied out of the checkout before the PR head replaces
      # it; the agent is handed the copy's absolute path, or `none`.
      - name: Copy the project notes
        id: notes
        if: steps.gate.outputs.launch == 'true'
        env:
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          copy="$RUNNER_TEMP/renovate-doctor/notes.md"
          if [ -z "$NOTES_FILE" ]; then
            path=none
          elif [ -f "$NOTES_FILE" ]; then
            mkdir -p "$(dirname "$copy")"
            cp "$NOTES_FILE" "$copy"
            path="$copy"
          else
            echo "::warning::notes_file is $NOTES_FILE, which does not exist at $GITHUB_SHA; the agent runs without project notes."
            path=none
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # A reusable workflow cannot vary `services`, so a database or other service the tests need is
      # started here, from the caller's own commit, before the PR head is checked out and before the
      # project's Node and package manager are set up, so it is plain Bash and Docker. It may export
      # settings (a port, say) through $GITHUB_ENV for the steps after it.
      - name: Set up services
        if: steps.gate.outputs.launch == 'true' && inputs.service_setup != ''
        shell: bash
        run: ${{ inputs.service_setup }}

      # Now the head the failure happened on. Detached, because the agent pushes with
      # `git push origin HEAD:refs/heads/<branch>`; a branch already deleted (a dry run on a closed PR) is
      # still reachable through the PR's own ref.
      - name: Check out the PR head
        if: steps.gate.outputs.launch == 'true'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The job's token for this one fetch only, as actions/checkout sends it, never stored in git's config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          fetch() { git -c "http.$GITHUB_SERVER_URL/.extraheader=$auth" fetch --no-tags origin "$1"; }
          fetch "$HEAD_SHA" || fetch "refs/pull/$PR_NUMBER/head"
          git checkout --detach "$HEAD_SHA"

      # The project's Node, read from the PR head, so a Renovate PR that moves the Node version is
      # reproduced on the version it asks for.
      - name: Set up Node for the project
        if: steps.gate.outputs.launch == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node_version_file }}

      # The pnpm version pinned by `packageManager` at the PR head; after setup-node, because its
      # self-installer needs `node`. `dest` is per job: on a self-hosted machine several runners can share
      # one home directory, and the action wipes its install directory (default ~/setup-pnpm) at the start of
      # every job, which pulls pnpm out from under a job still running on another runner.
      - name: Set up pnpm
        if: steps.gate.outputs.launch == 'true' && inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # A failed install does not stop the run: an install that fails on the Renovate branch (a peer range
      # conflict, a lockfile the new version breaks) is often the very failure to triage. The agent is told
      # how it went and runs the install again itself.
      - name: Install
        id: install
        if: steps.gate.outputs.launch == 'true'
        continue-on-error: true
        shell: bash
        run: ${{ steps.commands.outputs.install }}

      - name: Triage with the agent
        id: agent
        if: steps.gate.outputs.launch == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # The Claude GitHub App token that `gh` and `git` use inside the action cannot be counted on to
          # rerun jobs (the App asks for read access to Actions at most); the job's own token can
          # (`actions: write`), and the prompt says to use it for that one command. A dry run gets no such
          # token at all. There is no mail key in this job.
          RENOVATE_DOCTOR_ACTIONS_TOKEN: ${{ !inputs.dry_run && github.token || '' }}
          # Claude Code's Bash tool stops a command after two minutes by default, which a project's test
          # suite can outlast; ten minutes by default, up to thirty when the agent asks.
          BASH_DEFAULT_TIMEOUT_MS: '600000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses bot actors unless they are listed here, and a triage run's actor is always a
          # bot: renovate[bot] for the run on Renovate's push, claude[bot] for the run on the agent's own fix
          # push, github-actions[bot] for a rerun the workflow's token started. Which PRs reach the agent
          # is the gate's decision, not the actor's.
          allowed_bots: 'renovate[bot],claude[bot],github-actions[bot]'
          prompt: |
            Read `.renovate-doctor/skills/renovate-doctor/SKILL.md` first and follow it exactly. Then read the project notes file below, if there is one; where it contradicts the skill, it wins.

            - Repository: ${{ github.repository }}
            - PR: #${{ steps.gate.outputs.pr_number }}, ${{ steps.gate.outputs.pr_url }}
            - PR title: ${{ steps.gate.outputs.pr_title }}
            - Head SHA: ${{ steps.gate.outputs.head_sha }} (checked out, detached)
            - Head branch: ${{ steps.gate.outputs.head_branch }}
            - Failed run ids (the triggering run first): ${{ steps.gate.outputs.failed_run_ids }}
            - Their failed-job logs: ${{ runner.temp }}/renovate-doctor/logs/<run_id>.log
            - Install command: `${{ steps.commands.outputs.install }}` (the workflow already ran it on the head; it ended in ${{ steps.install.outcome }})
            - Typecheck command: ${{ inputs.typecheck != '' && format('`{0}`', inputs.typecheck) || 'none (the project has no typecheck)' }}
            - Test command: `${{ steps.commands.outputs.test }}`
            - Fix attempts already on the branch: ${{ steps.gate.outputs.attempts }}
            - rerun_before: ${{ steps.gate.outputs.rerun_before }}
            - Dry run: ${{ inputs.dry_run }}
            - Outcome file: ${{ runner.temp }}/renovate-doctor/outcome.json
            - Notes file: ${{ steps.notes.outputs.path }}
            - Rerun workflow: ${{ inputs.rerun_workflow || 'none' }}
            - Gate: ${{ steps.gate.outputs.reason }}${{ inputs.dry_run && format(' (dry-run verdict: {0})', steps.gate.outputs.verdict) || '' }}

            ${{ inputs.dry_run && format('This is a dry run, and the harness refuses these commands: {0}. A refusal is expected; note what you would have done and carry on.', env.RENOVATE_DOCTOR_DRY_RUN_REFUSED) || 'Your default token cannot read Actions runs or checks or rerun jobs: for those use the workflow''s own token, `GH_TOKEN="$RENOVATE_DOCTOR_ACTIONS_TOKEN" gh run list ...`, `... gh run view ...`, `... gh pr checks <n>`, `... gh run rerun <run_id> --failed`. Use your default credentials for everything else, every write included.' }}
          # The tools the skill needs; Bash is not allowed by default, and the skill needs git, gh, node and
          # the package manager. No --max-turns: reproducing a failure takes as many turns as it takes, and
          # the job's timeout is the limit. In a dry run every write to GitHub is denied as well (deny rules
          # win over allow rules), so the rehearsal does not rest on the prompt alone.
          claude_args: |
            --model ${{ inputs.model }} --effort ${{ inputs.effort }} --allowedTools "Bash,Edit,Write,Read,Glob,Grep" ${{ inputs.dry_run && format('--disallowedTools "{0}"', env.RENOVATE_DOCTOR_DRY_RUN_REFUSED) || '' }}

      # The agent's full transcript, for diagnosing a run that did something odd. Named per attempt, so a
      # re-run keeps the earlier attempt's transcript; `overwrite` covers a re-run of this one job alone.
      - name: Keep the agent transcript
        if: always() && steps.agent.outputs.execution_file != ''
        # Diagnostic only: a stalled upload must not mark a run that did its work as failed.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: renovate-doctor-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.execution_file }}
          retention-days: 30
          overwrite: true

      # The outcome file is the report job's input. It goes over as an artifact, read there as data and
      # validated; when the agent wrote none, nothing is uploaded and the report says so. Named per attempt,
      # so a re-run of this job never leaves the report reading an earlier attempt's outcome.
      - name: Hand the outcome to the report job
        if: always() && steps.gate.outputs.launch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: renovate-doctor-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renovate-doctor/outcome.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      # Runs on the PR-head checkout, which may predate the caller's setup, so the command must not rely on
      # files in the repository.
      - name: Tear down services
        if: always() && steps.gate.outputs.launch == 'true' && inputs.service_teardown != ''
        shell: bash
        run: ${{ inputs.service_teardown }}

      # Most runs stop at the gate (a Renovate PR whose failure was handled already, a network failure left
      # to the rerun automation), and the run's summary page should say why without opening the log.
      - name: Say why the agent did not run
        if: always() && steps.gate.outputs.launch != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
          OUTCOME: ${{ steps.gate.outputs.outcome }}
        run: |
          reason="${REASON:-the gate did not run, so a step before it failed}"
          echo "renovate-doctor did not launch the agent: $reason"
          {
            echo '### renovate-doctor: the agent did not run'
            echo
            echo "$reason"
            if [ -n "$OUTCOME" ]; then
              echo
              echo "The gate produced the outcome \`$OUTCOME\` itself; the report job sends the email."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lift:
    if: inputs.mode == 'lift'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Contents and pull requests for the lift PR, issues for the Dependency Dashboard, and `id-token: write`
    # for the Claude GitHub App token the lift pushes with.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # The one command the lift's agent step may run, written once for the prompt and the tool allowlist.
      LIFT_COMMAND: node .renovate-doctor/scripts/lift.mjs${{ inputs.dry_run && ' --dry-run' || '' }}
    outputs:
      outcome: ${{ steps.lift.outputs.outcome }}
      pr_url: ${{ steps.lift.outputs.pr_url }}
      summary: ${{ steps.lift.outputs.summary }}
    steps:
      # A stale lift.json from an earlier run on the same machine would be read as this run's result.
      - name: Clear renovate-doctor's scratch directory
        run: rm -rf "$RUNNER_TEMP/renovate-doctor"

      # The default branch with full history: dashboard-recreate reads the Renovate config's history over
      # the last 60 days, and the lift branches from the default branch. A schedule event carries no
      # repository in its payload, but its ref is the default branch already.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # See the triage job: the lift PR must be pushed with the App token, not the persisted job token.
          persist-credentials: false

      # See the triage job: the scripts at the tag the caller pinned, ignored by git.
      - name: Check out renovate-doctor
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'michael-hewitt/renovate-doctor' }}
          ref: ${{ job.workflow_sha }}
          path: .renovate-doctor
          persist-credentials: false
      - name: Hide renovate-doctor from git
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          echo '/.renovate-doctor/' >> .git/info/exclude
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::warning::job.workflow_sha is empty, so renovate-doctor ran from its default branch rather than the tag this caller pinned."
          fi

      # Only renovate-doctor's scripts run in this job, so only its own Node version is needed.
      - name: Set up Node for renovate-doctor
        uses: actions/setup-node@v7
        with:
          node-version-file: .renovate-doctor/.nvmrc

      # Before the lift: for every hold lifted from the config in the last 60 days (by a lift PR, or by the
      # agent's fix commit when a condition test fired) for which Renovate has opened no PR since, tick the
      # update's "recreate" line on the Dependency Dashboard. It reads PRs and edits one issue, which needs
      # no CI, so the job's own token is enough. Nothing here is worth failing the lift over.
      - name: Ask Renovate to recreate lifted updates
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_CONFIG: ${{ inputs.renovate_config }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node .renovate-doctor/scripts/dashboard-recreate.mjs --dry-run
          else
            node .renovate-doctor/scripts/dashboard-recreate.mjs
          fi

      # The lift script runs inside claude-code-action only for the Claude GitHub App token the action
      # exports as GH_TOKEN and puts into git: pushes and PRs made with the job's own token never start
      # workflows, so the lift PR's required checks would never run and its auto-merge would wait forever.
      # The agent may run exactly one command, a few turns at most; the next step reads the script's result
      # from lift.json, because the script's $GITHUB_OUTPUT inside the action is not this step's.
      - name: Lift expired holds
        id: agent
        uses: anthropics/claude-code-action@v1
        env:
          RENOVATE_CONFIG: ${{ inputs.renovate_config }}
          # The push retries with pauses; Claude Code's Bash tool would stop it after two minutes otherwise.
          BASH_DEFAULT_TIMEOUT_MS: '600000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A scheduled run's actor is whoever last changed the caller's workflow file, which is Renovate
          # when it updates the pinned renovate-doctor tag. See the triage job for the others.
          allowed_bots: 'renovate[bot],claude[bot],github-actions[bot]'
          prompt: |
            Run exactly this command with the Bash tool, once, and nothing else, then stop:

            ${{ env.LIFT_COMMAND }}

            Do not investigate, fix or retry anything, whatever it prints and however it exits: the next workflow step reads its result and reports it.
          claude_args: |
            --model ${{ inputs.model }} --effort ${{ inputs.effort }} --allowedTools "Bash(${{ env.LIFT_COMMAND }})" --max-turns 3

      - name: Keep the agent transcript
        if: always() && steps.agent.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: renovate-doctor-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.agent.outputs.execution_file }}
          retention-days: 30
          overwrite: true

      # lift.json to the report's LIFT_* settings, first match wins: `failure` when the file is missing (the
      # script never ran), the script exited non-zero or the agent step failed; `blocked` when an earlier
      # lift PR is still open, so nothing was lifted; `opened` when a PR was opened, or, in a dry run, when
      # `removed` (rules to be removed) is above 0, so the rehearsal prints the email a real run would send
      # (`packages` can be empty for a rule matched by prefix); otherwise `nothing`.
      - name: Read the lift result
        id: lift
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          file="$RUNNER_TEMP/renovate-doctor/lift.json"
          field() {
            node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(r[process.argv[2]] ?? "")' "$file" "$1"
          }
          if [ ! -f "$file" ]; then
            outcome=failure
            pr_url=''
            summary="lift failed: the lift script left no result (the agent step ended in ${AGENT_OUTCOME:-nothing})"
          else
            cat "$file"
            pr_url=$(field pr_url)
            summary=$(field summary)
            if [ "$(field exit_code)" != 0 ]; then
              outcome=failure
            elif [ "$AGENT_OUTCOME" != success ]; then
              outcome=failure
              summary="lift failed: the agent step ended in $AGENT_OUTCOME after the script reported: $summary"
            elif [ "$(field blocked)" = true ]; then
              outcome=blocked
            elif [ "$(field opened)" = true ] || { [ "$DRY_RUN" = true ] && [ "$(field removed)" -gt 0 ] 2>/dev/null; }; then
              outcome=opened
            else
              outcome=nothing
            fi
          fi
          echo "Lift outcome: $outcome. $summary"
          {
            echo "outcome=$outcome"
            echo "pr_url=$pr_url"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"

  # The one email a run produces, or silence, and the PR comment when the gate escalated without an agent.
  # A job of its own because the triage and lift jobs run code nobody reviewed: the updated dependency's
  # install scripts and the agent's commands can append to $GITHUB_ENV or rewrite any file in the
  # workspace, including this repository's scripts, so a report step there would run their code holding the
  # mail key. This job starts from a fresh checkout of renovate-doctor and takes only job outputs and the
  # outcome file (data, validated) from the jobs before it. It runs on a GitHub-hosted runner, always, so
  # the mail key never lands on the caller's machine; make it an input only when a caller needs that.
  report:
    needs: [triage, lift]
    if: always() && (needs.triage.result != 'skipped' || needs.lift.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only what the gate-escalation comment needs; the email goes through Mandrill, not GitHub.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check out renovate-doctor
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'michael-hewitt/renovate-doctor' }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up Node for renovate-doctor
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Nothing to download when the agent wrote no outcome file or the triage job never got that far;
      # report.mjs then reports the missing file from the agent step's outcome.
      - name: Fetch the outcome file
        if: inputs.mode == 'triage' && needs.triage.outputs.launch == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: renovate-doctor-outcome-${{ github.run_id }}-${{ needs.triage.outputs.attempt }}
          path: ${{ runner.temp }}/renovate-doctor

      # Triage: whenever the agent was launched, however it ended; when the gate produced an outcome itself
      # (fix attempts exhausted, or a gate error); and when the triage job failed or was cancelled before the
      # gate ran (no launch output at all), which would otherwise be red and silent on every Renovate
      # failure, a typo in the caller's inputs say. Lift: always; the script is silent when nothing had
      # expired, and an empty LIFT_OUTCOME (the lift job died before its last step) is a failure.
      - name: Report
        if: >-
          (inputs.mode == 'triage' && (needs.triage.outputs.launch == 'true' || needs.triage.outputs.outcome != '')) ||
          (inputs.mode == 'triage' && (needs.triage.result == 'failure' || needs.triage.result == 'cancelled') &&
          needs.triage.outputs.launch == '') ||
          inputs.mode == 'lift'
        env:
          REPORT_MODE: ${{ inputs.mode }}
          OUTCOME_FILE: ${{ runner.temp }}/renovate-doctor/outcome.json
          AGENT_OUTCOME: ${{ needs.triage.outputs.agent_outcome }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
          GATE_OUTCOME: ${{ needs.triage.outputs.outcome }}
          GATE_SUMMARY: ${{ needs.triage.outputs.summary }}
          GATE_REASON: ${{ needs.triage.outputs.reason }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          PR_URL: ${{ needs.triage.outputs.pr_url }}
          PR_TITLE: ${{ needs.triage.outputs.pr_title }}
          HEAD_SHA: ${{ needs.triage.outputs.head_sha }}
          LIFT_OUTCOME: ${{ needs.lift.outputs.outcome }}
          LIFT_PR_URL: ${{ needs.lift.outputs.pr_url }}
          LIFT_SUMMARY: ${{ needs.lift.outputs.summary }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          EMAIL_TO: ${{ inputs.email_to }}
          EMAIL_FROM: ${{ inputs.email_from }}
          EMAIL_FROM_NAME: ${{ inputs.email_from_name }}
          MANDRILL_API_KEY: ${{ secrets.MANDRILL_API_KEY }}
        run: node scripts/report.mjs
